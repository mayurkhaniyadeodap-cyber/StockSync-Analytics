<!doctype html>
<html lang="en" data-theme="light">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="color-scheme" content="light dark" />
    <title>StockSync Analytics — Inventory &amp; Shopify Sales Analytics</title>
    <!--
      Fonts are self-hosted from /fonts rather than fetched from Google Fonts as
      the prototype does: no third-party request from an internal ops tool, and
      the UI still renders if the office link is down. Declared in
      src/styles/fonts.css; Q11 is closed.

      The two faces carrying the first paint are preloaded. Without this the
      browser only discovers them after parsing the CSS, which is a visible
      re-flow from the fallback face on a cold load.
    -->
    <link
      rel="preload"
      href="/fonts/figtree-400-latin.woff2"
      as="font"
      type="font/woff2"
      crossorigin
    />
    <link
      rel="preload"
      href="/fonts/figtree-600-latin.woff2"
      as="font"
      type="font/woff2"
      crossorigin
    />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
