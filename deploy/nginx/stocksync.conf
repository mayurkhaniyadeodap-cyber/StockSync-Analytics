# StockSync Analytics — nginx site.
#
# One server block does two jobs: serve the built SPA, and hand /api to uvicorn.
# The order of the two `location` blocks is the whole trick — see below.
#
# Install:
#   sudo cp deploy/nginx/stocksync.conf /etc/nginx/sites-available/stocksync
#   sudo ln -sf /etc/nginx/sites-available/stocksync /etc/nginx/sites-enabled/
#   sudo nginx -t && sudo systemctl reload nginx
#
# `nginx -t` before every reload. A config that fails to parse takes the whole
# server down on restart, and reload refuses to apply it — so test first and a
# bad edit costs nothing.

# ---------------------------------------------------------------------------
# The API upstream — the one host-specific value in this file.
#
# VERIFY BEFORE INSTALLING. Getting this port wrong fails silently: nginx will
# proxy happily to whatever answers there, and the SPA reports the generic
# "The request failed." because the other app has no /api/auth/login.
#
#   curl -s http://127.0.0.1:8000/api/health
#
# StockSync answers with status / version / environment / database:
#
#   {"status":"ok","version":"…","environment":"production","database":{…}}
#
# Anything else is a different application. A response shaped like
# {"ok":true,"service":"…"} is NOT this app, whatever the service name says.
#
# If several FastAPI apps share this host, find the right one with:
#
#   for p in 8000 8001 8002 8080 9000; do
#     printf '%s: ' "$p"; curl -s -m 2 "http://127.0.0.1:$p/api/health"; echo
#   done
# ---------------------------------------------------------------------------
upstream stocksync_api {
    server 127.0.0.1:8000;

    # Reuse connections instead of opening one per request. Requires
    # `proxy_http_version 1.1` and a cleared Connection header, both set below.
    keepalive 16;
}

server {
    listen 80;
    listen [::]:80;

    # Replace with your hostname. nip.io resolves <anything>.<ip>.nip.io to that
    # IP, so this works without owning a domain — and certbot will issue for it.
    #
    # Deliberately NOT `default_server`. If another app shares this host, the
    # default block catches every request that matches no server_name, and
    # whichever block loads first silently wins. Name-based matching is what
    # keeps two apps apart; claiming the default undoes it.
    #
    # This also means `curl http://localhost/api/health` does NOT test this
    # block — localhost matches no server_name here and falls through to the
    # default. Always test with the real name:
    #
    #   curl -i -H 'Host: stocksync-analytics.3.108.50.185.nip.io' \
    #        http://localhost/api/health
    server_name stocksync-analytics.3.108.50.185.nip.io;

    # Where `npm run build` output was copied. Must contain index.html.
    #
    # nginx serves this as its own user (`www-data`), not as `stocksync`, so
    # every directory from / down to dist/ needs the traverse bit for others.
    # A checkout under /home is where this usually bites: Ubuntu creates home
    # directories 0750, and nginx then answers 403 for a file that is plainly
    # there. `sudo -u www-data stat <path>/index.html` is the check.
    root /home/ubuntu/StockSync-Analytics/frontend/dist;
    index index.html;

    # Must be >= STOCKSYNC_MAX_UPLOAD_MB (25 by default) or nginx rejects the
    # upload with its own 413 before the request ever reaches the app, and the
    # UI reports a generic failure instead of the app's own size message.
    client_max_body_size 25m;

    # ---------------------------------------------------------------------
    # The API. This block MUST come before the SPA fallback below.
    #
    # With the order reversed, `try_files ... /index.html` claims /api/*: a GET
    # returns index.html with a 200 (so the frontend parses HTML as JSON) and a
    # POST returns 405, because nginx will not POST to a static file. The 405
    # body is nginx's HTML error page, not the app's {error: {...}} envelope,
    # so the UI falls through to its generic "The request failed." — the exact
    # symptom this file exists to prevent.
    #
    # A 404 from /api/* usually means this block is absent from the server
    # block that actually matched the request. Check which file is serving the
    # hostname before editing this one:
    #
    #   sudo nginx -T | awk '/^# configuration file/{f=$4} /server_name/{print f"  "$0}'
    # ---------------------------------------------------------------------
    location /api/ {
        # No trailing slash and no URI part: the full /api/... path is passed
        # through unchanged, which is what the app expects
        # (STOCKSYNC_API_PREFIX=/api). Writing `proxy_pass http://…:8000/;`
        # instead would strip the /api prefix and every route would 404.
        proxy_pass http://stocksync_api;
        proxy_http_version 1.1;

        # Required for upstream keepalive: the default "close" would retire the
        # connection after every request and make the pool above pointless.
        proxy_set_header Connection "";

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # A full Shopify sync or a large spreadsheet import runs inside the
        # request. The default 60s cuts those off mid-flight.
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;

        # Report exports stream from disk; buffering them to a temp file first
        # adds latency and disk churn for no benefit.
        proxy_buffering off;
    }

    # The SPA. Any path that is not a real file is a client-side route, so it
    # gets index.html and React Router takes it from there.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Hashed build assets are immutable; index.html must never be cached or a
    # deploy leaves browsers loading a stale bundle that references deleted JS.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    location = /index.html {
        add_header Cache-Control "no-store";
    }
}
