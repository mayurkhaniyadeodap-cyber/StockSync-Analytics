[project]
name = "stocksync-backend"
version = "0.1.0"
description = "StockSync Analytics — inventory & Shopify sales reconciliation API"
requires-python = ">=3.12"

# Every dependency here is one the approved stack names directly (FastAPI,
# SQLAlchemy 2.x, Alembic) or its unavoidable runtime. SQLite needs no driver
# package — it ships with Python. Anything beyond that gets asked about first;
# see IMPLEMENTATION_PLAN.md §6.
dependencies = [
    "fastapi>=0.115,<1.0",
    "uvicorn[standard]>=0.32,<1.0",
    "sqlalchemy>=2.0.36,<3.0",
    "alembic>=1.14,<2.0",
    "pydantic>=2.10,<3.0",
    "pydantic-settings>=2.7,<3.0",
    "pyjwt>=2.10,<3.0",        # JWT signing; handles alg-confusion correctly
    "argon2-cffi>=23.1,<26.0", # argon2id password hashing (OWASP recommendation)

    # --- added in M2. Each one is required by a listed M2 capability; see
    # IMPLEMENTATION_PLAN.md §6 on the "ask before adding" rule.
    "python-multipart>=0.0.20,<1.0", # multipart/form-data; FastAPI cannot accept
                                     # an UploadFile without it (CSV/XLSX upload)
    "openpyxl>=3.1,<4.0",            # .xlsx reader. Python has csv built in but
                                     # nothing for Excel
    "cryptography>=44.0,<47.0",      # Fernet, to encrypt the Shopify Admin API
                                     # token at rest (STOCKSYNC_ENCRYPTION_KEY)
    "httpx>=0.28,<1.0",              # calls the Shopify Admin API for Test
                                     # Connection; already present as a test dep

    # Windows ships no IANA time zone database, so `zoneinfo` finds nothing and
    # every workspace silently reports in UTC — which is the bug the workspace
    # timezone support exists to fix. Linux usually has one; depending on it
    # anyway makes the behaviour the same on every platform.
    "tzdata>=2024.1",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3,<9.0",
    "ruff>=0.8,<1.0",
    "mypy>=1.13,<2.0",
    "types-openpyxl>=3.1,<4.0",  # openpyxl ships no stubs; mypy is strict
]

[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]

# ---------------------------------------------------------------------------
# ruff — lint + format
# ---------------------------------------------------------------------------
[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = ["alembic/versions"]

[tool.ruff.lint]
select = [
    "E", "W",   # pycodestyle
    "F",        # pyflakes
    "I",        # isort
    "B",        # bugbear
    "UP",       # pyupgrade
    "S",        # bandit — matters for a tool holding API tokens
    "T20",      # no print(); use the logger so redaction applies
    "RUF",
]
ignore = [
    "E501",     # line length is the formatter's job
    "B008",     # FastAPI's Depends() in defaults is the documented idiom
    # Ambiguous-unicode rules target homoglyphs in identifiers. Our en/em dashes
    # are deliberate prose in docstrings and comments, and the product's own copy
    # (₹, —) is full of them.
    "RUF001", "RUF002", "RUF003",
]

[tool.ruff.lint.per-file-ignores]
# S101: assert is the point. S105/S106: fixtures use literal credentials
# deliberately; the values are throwaway and never leave the test process.
"tests/*" = ["S101", "S105", "S106"]
# F811: a pytest fixture taken as a parameter shadows the name it was imported
# under, which is how fixture reuse across modules works. The formatter also
# moves a per-line noqa off the parameter when it wraps the signature, so the
# suppression has to live here.
"tests/test_hardening.py" = ["S101", "S105", "S106", "F811"]
"app/cli.py" = ["T201"]   # stdout is the interface of a command-line tool

# ---------------------------------------------------------------------------
# mypy
# ---------------------------------------------------------------------------
[tool.mypy]
python_version = "3.12"
strict = true
warn_unreachable = true
plugins = ["pydantic.mypy"]
exclude = ["^alembic/versions/"]

[[tool.mypy.overrides]]
module = "alembic.*"
ignore_missing_imports = true

# ---------------------------------------------------------------------------
# pytest
# ---------------------------------------------------------------------------
[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --strict-markers"
markers = [
    "integration: exercises a real database file rather than a stubbed probe",
]
