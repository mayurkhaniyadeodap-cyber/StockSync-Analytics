[alembic]
script_location = alembic
prepend_sys_path = .
path_separator = os

# Timestamped, slugged filenames so migrations sort chronologically and read as
# a changelog: 20260728_1430_add_workspaces.py
file_template = %%(year)d%%(month).2d%%(day).2d_%%(hour).2d%%(minute).2d_%%(slug)s

# sqlalchemy.url is intentionally absent — alembic/env.py reads
# STOCKSYNC_DATABASE_URL via app.config so there is exactly one source of truth
# and no chance of a password landing in a committed file.

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
